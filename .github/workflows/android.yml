name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ANDROIDSDK: /home/runner/.buildozer/android/platform/android-sdk
      ANDROIDNDK: /home/runner/.buildozer/android/platform/android-ndk
      ANDROIDAPI: 33
      ANDROIDMINAPI: 21

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias del sistema
        run: |
          sudo apt update
          sudo apt install -y \
            python3-pip build-essential git zip unzip \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libffi-dev libssl-dev \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libltdl-dev

      - name: Instalar Python deps
        run: |
          pip3 install --upgrade pip
          pip3 install --user "cython<3.0.0"
          pip3 install --user buildozer

      - name: Build APK (primer build limpio real)
        run: |
          export PATH=$HOME/.local/bin:$PATH

          # 🔥 BORRA build roto si existe
          rm -rf .buildozer

          # 🔥 ahora sí construye limpio
          yes | buildozer android debug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: bin/*.apk
