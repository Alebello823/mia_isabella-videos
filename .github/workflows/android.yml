name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4 # Actualizado para evitar deprecación

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias del sistema
        run: |
          sudo apt update
          sudo apt install -y \
            python3-pip build-essential git zip unzip \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libffi-dev libssl-dev

      - name: Instalar Buildozer y Cython
        run: |
          pip3 install --upgrade pip
          # Forzamos versiones estables para evitar errores de compilación
          pip3 install "cython<3.0.0" buildozer setuptools

      - name: Build con Buildozer
        run: |
          # Aceptamos licencias automáticamente
          yes | buildozer android debug

      - name: Subir APK
        uses: actions/upload-artifact@v4 # LA CLAVE: v4 es obligatoria ahora
        with:
          name: VideoDownloader-Package
          path: bin/*.apk
          
