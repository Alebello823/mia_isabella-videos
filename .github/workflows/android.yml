name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias
        run: |
          sudo apt update
          sudo apt install -y \
            python3-pip build-essential git zip unzip \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libffi-dev libssl-dev

          pip3 install --upgrade pip
          # Eliminamos conflictos de versiones previas
          pip3 install --user --upgrade "cython<3.0.0" wheel setuptools
          pip3 install --user buildozer

      - name: Build con Buildozer
        run: |
          # Añadimos el bin de pip al PATH para que reconozca buildozer
          export PATH=$PATH:$HOME/.local/bin
          yes | buildozer android debug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: App-Descargador
          path: bin/*.apk
          
          
