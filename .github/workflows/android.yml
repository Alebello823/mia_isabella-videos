name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias del sistema
        run: |
          sudo apt update
          sudo apt install -y \
            python3-pip build-essential git zip unzip \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libffi-dev libssl-dev \
            libltdl-dev

          pip3 install --upgrade pip

          # 🔥 FIX CLAVE: evitar error con Cython 3
          pip3 install --user "cython<3.0.0"

          # Buildozer + herramientas
          pip3 install --user --upgrade buildozer wheel setuptools

      - name: Configurar variables de entorno
        run: |
          echo "PATH=$HOME/.local/bin:$PATH" >> $GITHUB_ENV
          echo "ANDROIDSDK=$HOME/.buildozer/android/platform/android-sdk" >> $GITHUB_ENV
          echo "ANDROIDNDK=$HOME/.buildozer/android/platform/android-ndk" >> $GITHUB_ENV

      - name: Build con Buildozer
        run: |
          export PATH=$HOME/.local/bin:$PATH

          # 🔥 Limpieza para evitar errores de builds previos
          buildozer android clean

          # 🔥 Compilación
          yes | buildozer android debug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: App-Descargador
          path: bin/*.apk
